<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/createforge-mark.svg" />
    <link rel="apple-touch-icon" href="/createforge-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>CreateForge AI — AI Creative Workspace</title>
    <meta name="description" content="Write, generate, refine and transform content with one intelligent creative workspace." />
    <meta property="og:title" content="CreateForge AI — AI Creative Workspace" />
    <meta property="og:description" content="AI tools for turning ideas into finished work. Articles, titles, image synthesis, and background removal." />
    <meta property="og:url" content="https://createforgeai.tech" />
    <meta property="og:type" content="website" />
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Prevent theme flash on initial load -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('createforge_theme') || localStorage.getItem('pixora_theme') || 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen bg-[#f8fafc] dark:bg-[#080c14] text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
