services:
  # CreateForge AI Frontend (Static Site)
  - type: static
    name: create-forge-ai-frontend
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      # SPA fallback: Rewrite all non-asset requests to /index.html (Status 200, NOT a 301 redirect)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
